<div class="info-panel">
  <h2 class="text-info">
    Aktuelle driftsinformationer om afbrydelser og ledningsarbejder
  </h2>
  <mat-tab-group>

    <mat-tab label="Aktuelle"><br />
      <app-driftsinfo [driftsinfos]="aktuelle$ | async">
      </app-driftsinfo>
    </mat-tab>

    <mat-tab label="Planlagte"><br />
      <ng-container *ngIf="planlagte$ | async as planlagte">
        <mat-card appearance="outlined" *ngIf="planlagte.length === 0" class="driftsinfo-card mat-elevation-z7">
          Der er ingen planlagte driftsmeddelelser lige nu.
        </mat-card>
        <app-driftsinfo *ngIf="planlagte.length > 0" [driftsinfos]="planlagte">
        </app-driftsinfo>
      </ng-container>
    </mat-tab>

    <mat-tab label="Tidligere"><br />
      <app-driftsinfo [driftsinfos]="tidligere$ | async">
      </app-driftsinfo>
    </mat-tab>
  </mat-tab-group>
</div>
