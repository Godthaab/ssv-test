<div class="spinner-container" *ngIf="loading">
  <mat-spinner></mat-spinner>
</div>
<mat-card appearance="outlined" *ngFor="let driftsinfo of driftsinfos" class="driftsinfo-card mat-elevation-z7">

  <!-- Sætter OK img på:
    <p><span style="font-weight: bold;"><img src="./assets/img/ok.png" class="okAfstand" /></span> {{driftsinfo.publiceres?.toDate() | date:'dd-MM-yyyy HH:mm'}}</p>
  -->
    <p><span style="font-weight: bold;"></span>
      {{driftsinfo.publiceres?.toDate() | date:'dd-MM-yyyy HH:mm'}}</p>
  <mat-card-title><span style="font-size: 99%; font-weight: 700;">{{ driftsinfo.overskrift }}</span></mat-card-title>
  <mat-card-content>
    <span style="font-size: 110%;">{{ driftsinfo.beskrivelse }}</span>
  </mat-card-content>
  <mat-card-title><span style="font-size: 99%; font-weight: 700;">Berørte: {{driftsinfo.berorte}}</span></mat-card-title>
</mat-card>
