<div class="spinner-container" *ngIf="loading">
  <mat-spinner></mat-spinner>
</div>
<article *ngFor="let driftsinfo of driftsinfos" class="driftsinfo-card">

  <p class="driftsinfo-date">
    {{driftsinfo.publiceres?.toDate() | date:'dd-MM-yyyy HH:mm'}}
  </p>
  <h3 class="driftsinfo-title">{{ driftsinfo.overskrift }}</h3>
  <p class="driftsinfo-description">{{ driftsinfo.beskrivelse }}</p>
  <p class="driftsinfo-affected"><strong>Berørte:</strong> {{driftsinfo.berorte}}</p>
</article>
