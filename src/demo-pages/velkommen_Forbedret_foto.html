<!doctype html>
<html lang="da">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Sammenligning af det forbedrede og det nuværende forsidefoto for Stillinge Strands Vandværk.">
  <title>Forsidefoto – før og efter | Stillinge Strands Vandværk</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Arial, Helvetica, sans-serif;
      color: #263746;
      background: #edf5fb;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-width: 320px;
      background: linear-gradient(180deg, #dceefa 0, #f4f8fb 300px, #f4f8fb 100%);
    }

    header {
      padding: 22px 24px;
      color: #fff;
      background: #1976d2;
    }

    header p {
      width: min(100%, 960px);
      margin: 0 auto;
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: .02em;
    }

    main {
      width: min(100% - 32px, 960px);
      margin: 36px auto 56px;
    }

    h1 {
      margin: 0 0 10px;
      font-size: clamp(1.8rem, 4vw, 2.5rem);
      line-height: 1.15;
    }

    .intro {
      margin: 0 0 28px;
      color: #526879;
      font-size: 1.05rem;
      line-height: 1.55;
    }

    figure {
      margin: 0 0 24px;
      padding: 20px;
      overflow: hidden;
      background: #fff;
      border: 1px solid #d9e5ed;
      border-radius: 12px;
      box-shadow: 0 5px 18px rgb(36 67 91 / 10%);
    }

    figcaption { margin-bottom: 14px; }

    figcaption strong {
      display: block;
      margin-bottom: 4px;
      font-size: 1.3rem;
    }

    figcaption span { color: #607586; }

    img {
      display: block;
      width: min(100%, 800px);
      height: auto;
      margin: 0 auto;
      border-radius: 5px;
    }

    @media (max-width: 520px) {
      header { padding: 18px 16px; }
      main { width: min(100% - 20px, 960px); margin-top: 24px; }
      figure { padding: 12px; }
    }
  </style>
</head>
<body>
  <header><p>Stillinge Strands Vandværk</p></header>
  <main>
    <h1>Forsidefoto – før og efter</h1>
    <p class="intro">Her kan du sammenligne det forbedrede forsidefoto med det nuværende billede. Begge billeder vises i deres oprindelige format på 800 × 600 px.</p>

    <figure>
      <figcaption>
        <strong>Nyt, forbedret foto</strong>
        <span>Det foreslåede billede til forsiden</span>
      </figcaption>
      <img src="/assets/img/ssv_800x600.jpg" width="800" height="600" alt="Forbedret foto af stranden ved Stillinge med Storebæltsbroen i baggrunden">
    </figure>

    <figure>
      <figcaption>
        <strong>Nuværende foto</strong>
        <span>Det billede, der bruges på forsiden nu</span>
      </figcaption>
      <img src="/assets/img/strand_800X600.jpg" width="800" height="600" alt="Det nuværende foto af stranden ved Stillinge med Storebæltsbroen i baggrunden">
    </figure>
  </main>
</body>
</html>
